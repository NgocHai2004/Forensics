server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 0;          # be tự giới hạn upload (UPLOAD_MAX_MB)
    resolver 127.0.0.11 valid=10s;   # DNS của Docker: be build lại đổi IP vẫn tìm thấy
    set $be http://be:8000;

    location ~ ^/(api|file|thumb)/|^/(docs|openapi\.json)$ {
        proxy_pass $be;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;  # upload lớn đi thẳng sang be, không ghi tạm ở fe
        proxy_buffering off;
        proxy_read_timeout 1800s;     # hỏi đáp / index có thể chạy lâu
        proxy_send_timeout 1800s;
    }

    location /assets/ {               # tên file có hash -> cache lâu
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {           # luôn lấy bản mới để không phải Ctrl+F5 sau mỗi lần build
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;   # SPA: /chat, /evidence... -> React router
    }
}
